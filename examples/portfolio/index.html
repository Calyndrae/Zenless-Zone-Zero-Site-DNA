.hoyoverse.com/upload/op-public/2022/07/06/d470ce60105d0a25e13ad4d59a493444_4895174618765842034.png\"}],\"new-camp-icon\":[{\"name\":\"狡兔屋.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102027/a8fd1a67044ba93d0212e916a2329ea9_6955789118039223464.png\"}],\"gradient-color-mob\":\"#fd638f-#b47dff\"}","dtStartTime":"2022-04-29 01:41:37","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2022-04-29 01:41:44","iInfoId":102027,"sTagName":[],"sCategoryName":"","sSign":""}],"287":[{"sChanId":["1299"],"sTitle":"赛维里安·洛威尔","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「你们说大魔…呃，洛威尔长官？等、等等…他不在附近吧？你们确定？…好，那我就直说了！我从没见过他笑！他是真正的、真正的、真正的恶魔！」<\/p><p style=\"white-space: pre-wrap;\">——谨慎观察周围后，说话声越来越小、又陡然大叫起来的希希芙<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「大家都说，『赛维里安·洛威尔长官是所有治安官的榜样』。但我…好吧，虽然听起来有点可笑，但他不是我的榜样。如果『他能按照自己说好的时间回家』？那也不是！」<\/p><p style=\"white-space: pre-wrap;\">——赛斯<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「黑枝的档案里有他的资料。呃，这会不会有点夸张…我知道要『避免与之发生冲突』，但也不用最大字号、红色字体，加粗标注三次吧？」<\/p><p style=\"white-space: pre-wrap;\">——菲欧妮<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「长官他…好像会在大家出外勤的时候，给我的番茄和青衣前辈的绿植浇水？虽然我没有证据。我暂时还无法想象和他讨论任何工作以外的问题…」<\/p><p style=\"white-space: pre-wrap;\">——朱鸢<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"赛维里安-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/451c194407465c0b3b8ed23155cdffe4_7265282292065036610.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"赛维里安-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/6c20298349992ef86b067bc8330cc313_7372893491764088783.png\"}],\"new-chara-nav\":[{\"name\":\"角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/ee6274fe94180c14ee8bfd6a176b784c_8342345966518150172.png\"}],\"level-icon\":[],\"prop-icon-1\":[{\"name\":\"风.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/b60b27574c9c70a791f7c46e7eda7c9c_7431480135044190857.png\"}],\"prop-icon-2\":[{\"name\":\"强攻.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/47fc72d0dae8e4f9d4889dfd5b11a4bc_281900660500507983.png\"}],\"pagination-item-bg\":[{\"name\":\"赛维里安导航背景图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/56f488c7eb960013ef7971dc39a24511_6133855652571303518.png\"}],\"chara-nav\":[{\"name\":\"首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/5b7a1f1b291e4faa618566394020060e_5689839607822342264.png\"}],\"chara-avatar\":[],\"chara-name\":\"赛维里安·洛威尔\",\"chara-name-en\":\"Severian Lowell\",\"chara-color\":\"#1566b8\",\"chara-line\":\"「治安局秩序督察，赛维里安·洛威尔。不必寒暄了，现在情况如何？」\",\"chara-cv1-name\":\"杨超然\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"CHT Severian_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/f37892a26cc3ffce5b8cfd253e2cabde_6690160127560443745.mp3\",\"status\":\"success\"}],\"chara-cv1-audio2\":[{\"name\":\"CHT Severian_02.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/546db0f82bb4b740596f9e96c2bfff07_965714554163261354.mp3\",\"status\":\"success\"}],\"chara-cv2-name\":\"森川智之\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[],\"chara-cv2-audio2\":[],\"chara-cover-home\":[{\"name\":\"赛维里安-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/77d73765548b8b853934bca30483bbf0_1264590494870673851.png\"}],\"chara-cover-inner\":[],\"chara-cover-m\":[{\"name\":\"赛维里安-首页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166076/cbf33bdac24ba04342cbc0c61b5021a9_1980569595508381059.png\"}],\"chara-cover-inner-m\":[],\"chara-name-home\":\"\",\"chara-name-home-m\":\"\",\"chara-cover-special\":\"\"}","dtStartTime":"2026-09-12 12:00:00","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2026-09-11 18:49:49","iInfoId":166076,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["1290"],"sTitle":"菲欧妮·蕾法爱菈","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「在黑枝内部——除了老大，没人打得过她。但要是颁发一定『不败神话』这样闪亮的冠冕，又很担心把本就站不稳的菲欧妮哐当砸倒…」<\/p><p style=\"white-space: pre-wrap;\">——照<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「菲欧妮前辈是很有趣的人，和她出去玩从来都不会扫兴——你说…『意外情况』？开什么玩笑，要和菲欧妮前辈出去玩，当然得带上专门处理意外情况的照前辈~(*╹▽╹*)」<\/p><p style=\"white-space: pre-wrap;\">——琉音<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「嗯呢~嗯呢嗯嗯！！（这位女士——马路上不让睡觉！！）」<\/p><p style=\"white-space: pre-wrap;\">——认真巡察布很慌张<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「…根据现存实验数据推断，受试者无法『死亡』；生命体征指标一旦下滑，受试者的躯体便会被动调用富集的以太能，使其进入某种『超越』的状态…」<\/p><p style=\"white-space: pre-wrap;\">——关于◼◼◼◼◼◼◼的实验报告<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">坎卜斯黑枝<\/p><p style=\"white-space: pre-wrap;\">枝影所及，判席落座。<\/p><p style=\"white-space: pre-wrap;\">典范财团联合会<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"菲欧妮-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166075/4348c872448455cafc24343d94207899_4687641938791572349.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"菲欧妮-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166075/2e382473dc3a621562a1919d307672c7_3228512936229505892.png\"}],\"new-chara-nav\":[{\"name\":\"菲欧妮切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166075/3ab4bd7cf3d9f1fc3610911998092d4b_3593109565730567355.png\"}],\"level-icon\":[],\"prop-icon-1\":[{\"name\":\"火.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166075/f103073f42af06c22824df0e5baa86d7_4200900136915470092.png\"}],\ tent":"<p style=\"white-space: pre-wrap;\">「什么叫『我的另外九个助手去哪了？』…洛克茜一个人就能顶十个！」<\/p><p style=\"white-space: pre-wrap;\">——克拉蕾·弗林特<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「『最后一次』——第 17 次;『就一点点』——预算的 3.2 倍;『我自有分寸』——存疑。」<\/p><p style=\"white-space: pre-wrap;\">——洛克茜正在记录克拉蕾的会议发言并备注<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「从左往右，按出版年份排列，同一年按作者姓氏首字母，同一作者按系列编号…请不要自作主张，遇到困难请大喊洛克茜。」<\/p><p style=\"white-space: pre-wrap;\">——弗林特工坊的书架总是俨然<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「如果你不慎闯入维尔乌姆的深夜，听见了铿然的锤声…莫要东张西望、莫要窃窃私语…」<\/p><p style=\"white-space: pre-wrap;\">——跛脚乌鸦侦探社特别节目《维尔乌姆奇谭》<\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"洛克茜-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165591/33bd9437e054343e0e4622c9c7ae12a2_2355750625773298009.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"洛克茜-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165591/ab16e793bb74c119950b9a658186cb34_8658041235729148502.png\"}],\"new-chara-nav\":[{\"name\":\"洛克茜切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165591/7b532330df9e5ec9181ae5784ec199e2_4056724968358011061.png\"}],\"level-icon\":[],\"prop-icon-1\":[{\"name\":\"风.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165591/b60b27574c9c70a791f7c46e7eda7c9c_5636531375361013460.png\"}],\"prop-icon-2\":[{\"name\":\"击破.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165591/8ef3cf2bf25b3bd3ad50de6e55ae6774_6033098561908798775.png\"}],\"pagination-item-bg\":[{\"name\":\"洛克茜背景.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165591/f9f95153f36007f5e6ec42af05b09d93_2180787235784394634.png\"}],\"chara-nav\":[{\"name\":\"首页PC头像 (1).png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165591/2422c21d4ad5b0f7fdeeea7a12cabb58_31036 o":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「再睡五分钟？好的，这就为您取消议事会议…您改主意了？好的，我马上准备为小姐梳妆。」<\/p><p style=\"white-space: pre-wrap;\">——洛克茜·伊芙莉塔·普莱斯<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「这批研究项目的经费数额…是大了点，但你完全不用担心，谁让咱们家主大人耳根子软呢！」<\/p><p style=\"white-space: pre-wrap;\">——弗林特工坊的导师劝导着学徒，他志在必得<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「那位克拉蕾小姐？比起总务官，她更像是…整个罗斯凯利法的大债主吧。」<\/p><p style=\"white-space: pre-wrap;\">——维琳娜·艾嘉德<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「克拉蕾！紧急——再借我一点点点点辉金就好！负责运输的50只邦布已经在路上了，你直接把货交给他们就行，不用费心招待啦～」<\/p><p style=\"white-space: pre-wrap;\">——挽昼大人的加急邮件，洛克茜打算等茶会结束了再转交。<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"克拉蕾-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165587/cb362c936fca76f960df65c36e32771c_515885718218416658.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"克拉蕾-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165587/a95075a47f0c2d97febdc9a8e9ab0372_6302192113216155761.png\"}],\"new-chara-nav\":[{\"name\":\"克拉蕾导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165587/9a4ae2468240d983be108071cb0b0d9f_8062838139040480381.png\"}],\"level-icon\":[],\"prop-icon-1\":[{\"name\":\"电.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165587/dc4b43cf5fea25746c5f3318a50437b1_5666922971376402290.png\"}],\"prop-icon-2\":[{\"name\":\"锋域.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165587/5f116d1c02e860092091ee6c343da367_5091678147453434201.png\"}],\"pagination-item-bg\":[{\"name\":\"克拉蕾背景图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/165587/392a67e92f3fb2e9436897ef640c1236_7976382369199153103.png\"}],\"chara-nav\":[{\"name\":\"首页PC头像.png\",\"url\":\ sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["1354"],"sTitle":"希格莉德·德拉叙尔","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「希格莉德做的饼干一点也不输给她祖母，织出的围巾也很有她母亲的味道，至于战斗实力更是比之前所有的德拉叙尔们都要厉害！」<\/p><p style=\"white-space: pre-wrap;\">——林德薇恩<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「名称：无情击飞布。使命：第一时间击飞希格莉德随时有可能施舍的各种『小玩意儿』。」<\/p><p style=\"white-space: pre-wrap;\">——诺姆尚未成功的发明报告之一<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「总务次官大人轻挥寒芒，那如猛兽般袭来的空洞应声开裂——刹那间云雨散去，和平的阳光重新洒向罗斯凯利法！」<\/p><p style=\"white-space: pre-wrap;\">——焦点剧场里的旁白布在希格莉布抬手的几秒内完成了贯口<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「虚狩固然强无敌，但在希格莉德大人面前还差点意思！你见过全力希格莉德吗？在新艾利都战力榜上可是T0级，可惜除了林德薇恩大人，没人亲眼见过…」<\/p><p style=\"white-space: pre-wrap;\">——空巡局的士兵们，闲暇时的高谈阔论<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"希格莉德-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164897/03af6d5e1087e6963e5ee5ad23fa1949_2648202947786746049.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"希格莉德-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164897/2ce8c571141ddfaf54d12f0698c84167_795500607747274855.png\"}],\"new-chara-nav\":[{\"name\":\"希格莉德-角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164897/5f26c9d334247c60e7a2620a89e0a59b_1724384947772366753.png\"}],\"level-icon\":[],\"prop-icon-1\":[{\"name\":\"冰.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164897/57177821c5ea0f99264ddaceaf4820ce_4459737535268684337.png\"}],\"prop-icon-2\":[{\"name\":\"强攻.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164897/47fc72d0dae8e4f9d4889dfd5b11a4bc_5938855105964358661.png\"}],\"pagination-item-bg\":[{\"name\":\"希格莉德-导航背景图.png\",\"url\":\"/archive/files/fastcdn.hoyo a-name-home-m\":\"\",\"chara-cover-special\":\"\"}","dtStartTime":"2026-06-20 12:00:00","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2026-06-18 19:57:57","iInfoId":164897,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["1353"],"sTitle":"蕾米埃尔·丹","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「你可别被那个坏女人蛊惑了！下次遇到她，我、我会带你一起逃跑的！」<\/p><p style=\"white-space: pre-wrap;\">——希希芙<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「嗯呐呐呐？！！（我可没有看见什么粉头发的可疑女人——噢不，我没有说过她是粉头发！）」<\/p><p style=\"white-space: pre-wrap;\">——一位有待优化撒谎模块的嗯呢帮成员<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「读到这封信时，不管是你，还是你生活其中的那个世界。都已经，变了模样。」<\/p><p style=\"white-space: pre-wrap;\">——《吾本如斯》<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「初代虚狩，◼◼◼◼与◼◼◼◼于百年前的高危空洞任务中遭遇不测，双双殉职。此任务相关档案记载现已遗失，故无更多相关细节可考。」<\/p><p style=\"white-space: pre-wrap;\">——《奇迹之都——艾利都建城史》<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"蕾米埃尔-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164866/1a2dfe704086cc87b9c9d508a1d44d17_4611563283207426392.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"蕾米埃尔-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164866/2015d20107db2d82480d40424d1224bf_6552950216765747639.png\"}],\"new-chara-nav\":[{\"name\":\"蕾米埃尔-角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164866/96c1101efec9507b4b8c2e87ac095891_3281047496242583592.png\"}],\"level-icon\":[{\"name\":\"srank (1).png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164866/e98ac33c6753ff7b8d28fb519d8eb1c3_3357790971348803263.png\"}],\"prop-icon-1\":[{\"name\":\"蕾米 光属性 46_45.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164866/9c9077cb7efa48b4856da482cb105387_5212239212 35d681ec_1460946000700742193.png\"}],\"chara-cover-inner\":[],\"chara-cover-m\":[{\"name\":\"蕾米埃尔-首页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/164866/299461eca32ec6335edaed7de83bb842_4049253948341604257.png\"}],\"chara-cover-inner-m\":[],\"chara-name-home\":\"\",\"chara-name-home-m\":\"\",\"chara-cover-special\":\"\"}","dtStartTime":"2026-06-20 10:00:00","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2026-06-18 17:13:15","iInfoId":164866,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["1306"],"sTitle":"诺姆·霍洛维尔","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「诺姆，不可以说客人的头发像是『被电磁脉冲扫过的鸟窝』哦。下次你可以说——『您的造型很有生命力』。来，跟我再念一遍。」<\/p><p style=\"white-space: pre-wrap;\">——维琳娜正在增补《外务筹策局公务礼仪手册》<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「破坏是创造之母，首席技术官小姐常常这么说。这也是我们在走廊处每三十米设置消防设施的原因——为了创造力的充分发挥…应该吧。」<\/p><p style=\"white-space: pre-wrap;\">——微微发汗的外策局员工<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「嗯呢嗯呢嗯呢！（要是没挡住那些花言巧语，失足掉入她的陷阱之中…）」<\/p><p style=\"white-space: pre-wrap;\">——语毕，互助会上的诺姆受害布们陷入深深的沉默<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「作战序列B-嗯呢弹幕！作战序列A-隆隆钻头！作战序列Z——你不会想知道的~」<\/p><p style=\"white-space: pre-wrap;\">——诺姆，正在炫耀自己引以为傲的武器库存<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"诺姆-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163786/a29aae92640f03e7b757fe9d566e293a_8464358984211253367.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"诺姆-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163786/50f36d416f992794a5e6b4ff75eb9c2b_7579751807498555704.png\"}],\"new-chara-nav\":[{\"name\":\"诺姆-角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163786/b25c936e56b255c712438ec6a7ffe8d0_4005538537761667919. rma_02.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163786/62cc223942126233995071bfc358f85f_3231121991421676442.mp3\",\"status\":\"success\"}],\"chara-cover-home\":[{\"name\":\"诺姆-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163786/67a55d60d2f462662c280bcef95e3498_7400697906998431521.png\"}],\"chara-cover-inner\":[],\"chara-cover-m\":[{\"name\":\"诺姆-首页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163786/1d6571c9497fb9c8f2912b1cdb4136a7_3647840942892679458.png\"}],\"chara-cover-inner-m\":[],\"chara-name-home\":\"\",\"chara-name-home-m\":\"\",\"chara-cover-special\":\"\"}","dtStartTime":"2026-04-29 12:30:00","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2026-04-28 16:44:24","iInfoId":163786,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["1306"],"sTitle":"维琳娜·艾嘉德","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「要是某件事让我苦恼，尽快处理妥当就好。要是某个人让我苦恼，呵…」<\/p><p style=\"white-space: pre-wrap;\">——聊到最近烦恼的话题，总务官小姐微笑回应<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「不管是讨厌的文书还是难缠的大人，要是遇到麻烦，就去找她摆平吧，小维可是高性能的！」<\/p><p style=\"white-space: pre-wrap;\">——导览中的诺姆送上了锦囊一则<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「你说长官？她当然很可靠！不过…要是你捅了什么篓子，还是不要太依赖她为妙。她是可以帮你解决，可是具体的解决方式就…」<\/p><p style=\"white-space: pre-wrap;\">——外务筹策局的入职培训会上，他们正在交换信息<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「嗡呢…嗡呢…（下一个就轮到我了…银发魔女…不要过来…天使大人…救救我…）」<\/p><p style=\"white-space: pre-wrap;\">——休眠中的邦布市民，逻辑核心中似乎产生了数据乱流<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"维琳娜-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163785/d5e2d9545a1490db7f6219c9d0787466_6984786355115559918.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"维琳娜-立绘-内页移动端.png\",\"url\":\ yle=\"white-space: pre-wrap;\">「啊？比利的新装备？他最近确实常和我提起想预支工资买个大家伙，肯定又是什么限量啦、绝版啦、等身周边之类的，反正别放在狡兔屋的客厅就行。我现在也没空管这个啦，等我搞完手头的大单子再——」<\/p><p style=\"white-space: pre-wrap;\">——电话那头，妮可断断续续的语音戛然而止<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「他的新形态？算是意料之中吧…不，还是有一点挺出人意料的——他还记得那条红围巾。」<\/p><p style=\"white-space: pre-wrap;\">——莱特<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「你的意思是，你的新装备可以变出枪，也能变出炮…什么都能变？真的吗？那能变出青花鱼吗？！…果然不行啊，我就知道，没劲。」<\/p><p style=\"white-space: pre-wrap;\">——猫又给比利的「武备宣讲会」测试反馈打了0分<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「你以为星徽骑士，只诞生于被选中的名字之中吗？你错了，只要在黑暗面前仍怀抱勇气——星徽，便会回应你的呼唤！」<\/p><p style=\"white-space: pre-wrap;\">——《星徽骑士》第二季第七集<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"chara-nav\":[{\"name\":\"SP比利-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163293/28d23c50c6c4f4cb06575b59d043e5af_6099103243789045887.png\"}],\"chara-avatar\":[{\"name\":\"SP比利-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163293/b1eefbc5bc1a59df46eaaebcea66604f_643202527667969025.png\"}],\"chara-name\":\"星徽·比利\",\"chara-name-home\":\"\",\"chara-name-en\":\"Starlight - Billy\",\"chara-color\":\"#df4228\",\"chara-line\":\"「只是个路过的——星徽骑士！」\",\"chara-cv1-name\":\"陈润秋\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_StarlightBilly_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163293/abdc06fc7d94c291dc0b633a3740a8b6_6216080633263097332.mp3\",\"status\":\"success\"}],\"chara-cv1-audio2\":[{\"name\":\"Vo_Gacha_Getchar_StarlightBilly_02.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163293/5153a73ffd1fc24a67de738b7ddcd46f_3381543385657370610.mp3\",\"status\":\"success\"}],\"chara-cv2-name\":\"林勇\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Sta rchive/files/fastcdn.hoyoverse.com/content-v2/nap/163293/8a96e86f9c08e1b037174c953e85c4f4_1226466374899758262.png\"}]}","dtStartTime":"2026-03-28 12:00:00","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2026-03-27 10:59:09","iInfoId":163293,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["1290"],"sTitle":"普罗米娅","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「不行不行，绝对不行！那可是座不能接近的冰山，再不赶紧逃走就要出事了…喂！停，我的小命可是很宝贵的！」<\/p><p style=\"white-space: pre-wrap;\">——希希芙<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「一个秘密，也许她并没有你想象中的那样…呀，差点说漏嘴了，这可不是免费情报。」<\/p><p style=\"white-space: pre-wrap;\">——照<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「女士，您打算点一杯茶奶吗？…啊？抱、抱歉，我没注意到您、您的手手手…」<\/p><p style=\"white-space: pre-wrap;\">——例行宣传招牌饮品的可可手忙脚乱地解释<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「解开它吧！向所有人露出你的獠牙，你的本性…我的，『老朋友』。」<\/p><p style=\"white-space: pre-wrap;\">——空洞里，铁面下的利齿发出狂妄的冷笑<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"普罗米亚-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/d8b0bb6abf166120cd1ac42d7ff30dfe_3890419908701656456.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"普罗米亚-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/ae8fea3490c208e1ec5472225d95f9bc_8958211200051508612.png\"}],\"new-chara-nav\":[{\"name\":\"普罗米亚-角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/4ca1e7e8d9764b09c5bf416a5fae735e_6630919234219680566.png\"}],\"level-icon\":[{\"name\":\"srank (1).png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/e98ac33c6753ff7b8d28fb519d8eb1c3_3473782909762861250.png\"}],\"prop-icon-1\":[{\"name\":\"冰.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/57177821c5ea0f99264ddaceaf4820ce_4490406492996013692.png\"}],\"prop-icon-2\":[{\"name\":\"异常.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/cbfdcc694851b12252df16af576d824e_4728481810343578085.png\"}],\"pagination-item-bg\":[{\"name\":\"普罗米亚-导航背景图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/56f56df93818b712591aa0b700dd63dd_3030529272005533624.png\"}],\"chara-nav\":[{\"name\":\"普罗米亚-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/db1ee7a8af36bff7427951c3c85c0436_1098988075508054677.png\"}],\"chara-avatar\":[{\"name\":\"普罗米亚-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/db1ee7a8af36bff7427951c3c85c0436_5111349366664756870.png\"}],\"chara-name\":\"普罗米娅\",\"chara-name-en\":\"Promeia\",\"chara-color\":\"#a39af3\",\"chara-line\":\"「我早已做好折断的准备了。」\",\"chara-cv1-name\":\"云鹤追\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Promeia_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/f61f36a0ba1f15d21d305f31e60a127e_8441479158994155746.mp3\",\"status\":\"success\"}],\"chara-cv1-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Promeia_02.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/47e0ec630e6bc6a70103305fbb4794f1_7745968439479472526.mp3\",\"status\":\"success\"}],\"chara-cv2-name\":\"鬼头明里\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Promeia_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/777464fca2a2250131cef4de1d2ab79e_8179479154289601706.mp3\",\"status\":\"success\"}],\"chara-cv2-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Promeia_02.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/f3fcccd76a4df96af0822b7542b49488_3766267226532543619.mp3\",\"status\":\"success\"}],\"chara-cover-home\":[{\"name\":\"普罗米亚-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/773b2529f0825fbc356ece1e1b1fe347_7980823850425538175.png\"}],\"chara-cover-inner\":[],\"chara-cover-m\":[{\"name\":\"普罗米亚-首页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/163316/df7d7c98cc566317280c98ce7242b60f_5428414730054598619.png\"}],\"chara-cover-inner-m\":[],\"chara-name-home\":\"\",\"chara-name-home-m\":\"\",\"chara-cover-special\":\"\"}","dtStartTime":"2026-03-28 11:00:00","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2026-03-28 00:46:55","iInfoId":163316,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["1299"],"sTitle":"希希芙","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「谁是治安局的？你说的是我？求求你，别说这种鬼故事！」<\/p><p style=\"white-space: pre-wrap;\">——被问起她成为案件专员的经过时<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「她这个月的报销款项是…3面橱窗玻璃、1辆旧能源轿车、还有…27碗蛋包饭？别多问，转至长官的个人账户即可，这些案件专员的花费从来不走公账，也不需要理由。」<\/p><p style=\"white-space: pre-wrap;\">——都市秩序部的财务核算专员正在告知新来的同事<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「对她的合作评价吗？大概是绝对不会把饭分给别人吃的，自私又可爱的『同事』吧~」<\/p><p style=\"white-space: pre-wrap;\">——简<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「她总是一见到我就腿软…难道是我向她打招呼的声音太大了吗？」<\/p><p style=\"white-space: pre-wrap;\">——朱鸢<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"希希芙-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/585f3ee1e8c2b94705a63f5a825884cc_1759813847728465106.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"希希芙-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/f6486fc7e705e440614186a5aab4c42e_5196093619953562562.png\"}],\"new-chara-nav\":[{\"name\":\"希希芙-角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/0cf70ac98d5e736b6f04d496410c6efc_5973355059611209114.png\"}],\"level-icon\":[{\"name\":\"srank (1).png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/ef4310d8f18a62aa70f412fb534b1086_2189861633491864557.png\"}],\"prop-icon-1\":[{\"name\":\"电.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/9c940fbfbc5914ec6968b608b9bd7c22_5193981200505614243.png\"}],\"prop-icon-2\":[{\"name\":\"强攻.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/9c235bd990f3bce4af09d143c3f6d596_9039414943938262372.png\"}],\"pagination-item-bg\":[{\"name\":\"希希芙-导航背景图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/70079eb642789e6fb17f258cca494d88_9065760633870077552.png\"}],\"chara-nav\":[{\"name\":\"希希芙首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/5e310111c288e79458136872d29e1aba_123795829958409551.png\"}],\"chara-avatar\":[{\"name\":\"希希芙首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/5e310111c288e79458136872d29e1aba_7600079664272507282.png\"}],\"chara-name\":\"希希芙\",\"chara-name-en\":\"Cissia\",\"chara-color\":\"#f4336e\",\"chara-line\":\"「你们说的『爱』和『责任』可真复杂。我只知道——喜欢的，就咬住不放~」\",\"chara-cv1-name\":\"降温\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Cissia_01[1].mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/1a2f7b4e0035f6c5dcb12da3397a513f_3693924867891231707.mp3\",\"status\":\"success\"}],\"chara-cv1-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Cissia_02[1].mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/06381502b920c5194b7922ed8626a02d_3770071370439343135.mp3\",\"status\":\"success\"}],\"chara-cv2-name\":\"菲鲁兹·蓝\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"希希芙1.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/32e2e7601e5effe1db937dc03f1db491_3552856576020138813.mp3\",\"status\":\"success\"}],\"chara-cv2-audio2\":[{\"name\":\"希希芙2.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/d596a6a01d22fc97f2be01deab7dd593_1280641921711895282.mp3\",\"status\":\"success\"}],\"chara-cover-home\":[{\"name\":\"角色介绍立绘-1805×1253PC切图模板.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/1eaf4fcf4f26bfb87811abeb4f0c2137_7977558499983418925.png\"}],\"chara-cover-inner\":[],\"chara-cover-m\":[{\"name\":\"角色介绍立绘-750×460移动端切图模板.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162680/6889886b70b2d4e0a39d3d2dde9c14a3_8911477565522690316.png\"}],\"chara-cover-inner-m\":[],\"chara-name-home\":\"\",\"chara-name-home-m\":\"\",\"chara-cover-special\":\"\"}","dtStartTime":"2026-02-13 12:00:00","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2026-02-11 19:05:10","iInfoId":162680,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["1296"],"sTitle":"南宫羽","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「噗——小羽！你、你这哪里是哭，分明是五官在表演啦！」<\/p><p style=\"white-space: pre-wrap;\">——手指上的辣椒酱可以她潸然泪下，也可以让队友破涕为笑<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「南、南宫！这个舞步…难道…对人类来说很简单吗？！我才不相信！」<\/p><p style=\"white-space: pre-wrap;\">——在从从容容的天才面前，哪怕是构造体也显得匆匆忙忙<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「好羡慕小南宫啊…熬夜的时候，羽毛不会掉下来、光环也不会——这才是真正的『作为创作者的优势』吧？」<\/p><p style=\"white-space: pre-wrap;\">——组合内唯一一组「真实」的光环和羽毛，连声乐老师都为之感慨<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「我最大的烦恼？应该是『如何约束两位队友』吧…最大的乐趣吗？刚才也说过了哦~」<\/p><p style=\"white-space: pre-wrap;\">——在「妄想天使」，大家都有自己的分工，而她是决定分工的人<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"南宫-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/162652/af24710d9e7d31f33c7a12589bd14ba2_5515650277664403500.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"南宫-立绘-内页移动端 .png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/16 情不自禁地露出微笑…练舞和被迫戴猫耳头饰的时候也是。」<\/p><p style=\"white-space: pre-wrap;\">——趁着天使们沉浸在排练中，她们的「老师」打开了购物软件<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"千夏-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/161791/a434b4e933780b981ddb5f3921021f96_1662707093912015375.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"千夏-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/161791/81a5af6d0b4e08793259f2c50e817d84_2048442763104667505.png\"}],\"new-chara-nav\":[{\"name\":\"千夏-角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/161791/dac8297c9b859ad459f37cdccfb224e5_8726935340030599228.png\"}],\"level-icon\":[],\"prop-icon-1\":[{\"name\":\"物理.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/161791/82ebd0e8c691cbf6f645f40b484e0abf_7089448038208605256.png\"}],\"prop-icon-2\":[{\"name\":\"支援.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/161791/545cc19625b5287a2fbd91ed6732b136_921187166913763514.png\"}],\"pagination-item-bg\":[{\"name\":\"千夏-导航背景图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/161791/8f7a15d5b204c1a9dcbbee6f872556dc_862102613909159525.png\"}],\"chara-nav\":[{\"name\":\"千夏真-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/161791/1782d10f7e3be156b513dd5c13b8199b_2213396738931141847.png\"}],\"chara-avatar\":[{\"name\":\"千夏真-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/161791/1782d10f7e3be156b513dd5c13b8199b_3532061376074889560.png\"}],\"chara-name\":\"千夏\",\"chara-name-en\":\"Sunna\",\"chara-color\":\"#58e7d5\",\"chara-line\":\"「啊啊啊！好、好紧张…好想找条地缝——把所有观众都捶进去！」\",\"chara-cv1-name\":\"木雅瑞林\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"千夏1中文.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/161791/029ef56a4c4a3e32587e8d9ee7aae242_380581381933187356.mp3\",\"status\":\"success\"}],\"chara-cv1- ><p style=\"white-space: pre-wrap;\">「她的日记里可有不少关于你的事喔…想看吗？我会帮你保密的~」<\/p><p style=\"white-space: pre-wrap;\">——危险的耳语布满陷阱<\/p>","sExt":"{\"chara-nav\":[{\"name\":\"叶瞬光-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160762/72decac9f08ade9215c5c0b86001748a_6561191971186085326.png\"}],\"chara-avatar\":[{\"name\":\"叶瞬光-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160762/fb43a27e44bf84aa26e44d36c40bb65a_5140436400508991659.png\"}],\"chara-name\":\"叶瞬光\",\"chara-name-en\":\"Ye Shunguang\",\"chara-color\":\"#db3c2f\",\"chara-line\":\"「我愿执剑，碎尽万般因果。」\",\"chara-cv1-name\":\"陶典\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"OngoingLevel_Chapter150_YeShunguang_111522002_003.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160762/e04c3e98eb92a9ffc9bdcb279054f292_8455097066650424141.mp3\",\"status\":\"success\"}],\"chara-cv1-audio2\":[{\"name\":\"真身叶瞬光_我乃云岿山.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160762/c631c9f9b8b9de10948e2e645d185418_4345018736111699606.mp3\",\"status\":\"success\"}],\"chara-cv2-name\":\"M・A・O\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Yeshunguang_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160762/8781562ca4e6411d60fb0ec662b050ce_865946728331364785.mp3\",\"status\":\"success\"}],\"chara-cv2-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Yeshunguang_03.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160762/faf27915f54eeeb31851d745d43dcabb_363243595085698197.mp3\",\"status\":\"success\"}],\"chara-cover-home\":[{\"name\":\"叶瞬光-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160762/10ea46188c13f32ec74632f544a01065_8689182190502564087.png\"}],\"chara-cover-inner\":[],\"chara-cover-m\":[{\"name\":\"叶瞬光-首页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160762/659fa521b773525770e9b13cb7440a6d_3763364043418958119.png\"}],\"chara-cove e-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「青椒炒肉去肉…番茄炒蛋走蛋？红豆姐，这个订单可怎么是好啊！」<\/p><p style=\"white-space: pre-wrap;\">——饮茶仙的实习生哪见过这个<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「人不过是大小有别的砝码，若没有足够的重量，又怎敢要求天平向你倾斜？」<\/p><p style=\"white-space: pre-wrap;\">——那片泥沼向来信奉「公平」<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"照-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160758/8b90f4ec335bba4b9322cc56acb0dd53_8049703970031559480.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"照-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160758/c4aecfb3267156f7e7cfbc7ebf64e785_2265476078061343251.png\"}],\"new-chara-nav\":[{\"name\":\"照-角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160758/999b6e54eae363d4de767e41f66b2906_3578425708730763239.png\"}],\"level-icon\":[{\"name\":\"srank (1).png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160758/e98ac33c6753ff7b8d28fb519d8eb1c3_240420650854287270.png\"}],\"prop-icon-1\":[{\"name\":\"冰.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160758/6d34dfc84836a2cf434b982d0773ae45_6872494922412306651.png\"}],\"prop-icon-2\":[{\"name\":\"防护.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160758/50c1c8d255e8f6b00aa2f4be1afb2548_6941248929116648173.png\"}],\"pagination-item-bg\":[{\"name\":\"照-导航背景图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160758/895f0a0d71af1203f4b11548ed65b4b3_1784613253086630322.png\"}],\"chara-nav\":[{\"name\":\"照-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160758/e67bd00a46d45578a48172d77f29e891_413095638383176981.png\"}],\"chara-avatar\":[{\"name\":\"照-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160758/e00785d194cb0ea13b2483033f0ef14f_2021520199534046289.p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「那天我正在观内洒扫，路过的般岳师父说我发力不实、神意涣散，突然出手——咔嚓一下，很快啊。」<\/p><p style=\"white-space: pre-wrap;\">——已接受道歉的橘福福<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「他就这么『勿，勿！』地叫着，配合他那张看不出什么表情的脸，乍一听，还以为他哭了呢。噢！忘记拍下来了。」<\/p><p style=\"white-space: pre-wrap;\">——曾企图给般岳「植毛」的琉音<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「…未来你的选择，可以是你存在于世，拥有一颗『心』的最好宣言。」<\/p><p style=\"white-space: pre-wrap;\">——「新生」之时隐隐绰绰的低语<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"般岳-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160168/5ca3559a147248da4114afa504397dd1_7044586231265510305.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"般岳-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160168/34904159f04b8b2a886e7a19aea4d3af_4689251003925895508.png\"}],\"new-chara-nav\":[{\"name\":\"般岳-角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160168/775b3325b068d44cdc4fffa4f93493b3_2495681786138156438.png\"}],\"level-icon\":[{\"name\":\"srank_(1)[1].png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160168/e98ac33c6753ff7b8d28fb519d8eb1c3_672228367372426628.png\"}],\"prop-icon-1\":[{\"name\":\"火.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160168/f103073f42af06c22824df0e5baa86d7_303892707652671730.png\"}],\"prop-icon-2\":[{\"name\":\"命破.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160168/746deee559c534f710bbd656f487d73b_6499056368460801922.png\"}],\"pagination-item-bg\":[{\"name\":\"般岳-导航背景图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160168/ab9ecac96331b0e3106d1188f50efe56_3356149924251453428.png\"}],\"chara-nav\":[{\"name\":\"般岳-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/c Name":"","sSign":""},{"sChanId":["1290"],"sTitle":"琉音","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「他们总说你『小嘴淬毒』是何缘故，可是最近暑气侵体，排毒不畅所致？」<\/p><p style=\"white-space: pre-wrap;\">——匆忙带来几味药方的般岳<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「作为后辈，你逾矩了，请把手从我的耳朵上拿开。或者…再重新考虑下我开的条件呢~」<\/p><p style=\"white-space: pre-wrap;\">——只见兔希人话锋一转<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「感谢客服『Dialyn』推荐的『战神畅聊话费包』，现在总算可以继续我的第28次投诉，她的精心推荐给了我继续客诉TOPS的底气。」<\/p><p style=\"white-space: pre-wrap;\">——爱来自澄辉坪<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「还差一点…一定要活着…活着回去…」<\/p><p style=\"white-space: pre-wrap;\">——时间那头传来的亡语未曾消融<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"new-chara-cover-inner\":[{\"name\":\"琉音-立绘-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160142/db55d17d2579691f6869324d936c36cd_6817426395033233132.png\"}],\"new-chara-cover-inner-m\":[{\"name\":\"琉音-立绘-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160142/528b39fd4457f1e314be45386254658c_3368618885612679614.png\"}],\"new-chara-nav\":[{\"name\":\"琉音-角色切换导航图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160142/45a03d95c7bbaf97ff914fc6fd0645ff_4465205471916795157.png\"}],\"level-icon\":[{\"name\":\"srank (1).png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160142/e98ac33c6753ff7b8d28fb519d8eb1c3_4090293958570109862.png\"}],\"prop-icon-1\":[{\"name\":\"物理.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160142/5ce2a9d07338b830be5e0a473e2805ba_1758312646118637264.png\"}],\"prop-icon-2\":[{\"name\":\"击破.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/160142/8ef3cf2bf25b3bd3ad50de6e55ae6774_8936669405838008553.png\"}],\"pagination-item-bg\":[{\"name\":\"琉音-导航背景图.png\",\ -space: pre-wrap;\">「来历不明、充满危险气息的冷血怪物…『老席德』，她真的值得你付出性命来守护吗？」<\/p><p style=\"white-space: pre-wrap;\">——女人凝视着手中早已泛黄的体检报告单<\/p>","sExt":"{\"chara-nav\":[{\"name\":\"席德-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/157829/b1d603f5c1e38063e1b17b96d09c11dd_7021254278826428848.png\"}],\"chara-avatar\":[{\"name\":\"席德-角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/157829/7d748a5d77c3ef4675c8f2875998c12d_4576469805434837269.png\"}],\"chara-name\":\"「席德」\",\"chara-name-home\":\"「席德」\",\"chara-name-en\":\"Seed\",\"chara-color\":\"#aee2ef\",\"chara-line\":\"「绳匠…是『同类』呢。就像四叶草和油菜花。」\",\"chara-cv1-name\":\"苏婉/赵梓涵\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Seed_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/157829/488b83107e52725e2e5c436e94be3207_7404402613959500379.mp3\",\"status\":\"success\"}],\"chara-cv1-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Seed_02.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/157829/e265acb9e05d0de8069e351ee6c86fab_4729059305687829429.mp3\",\"status\":\"success\"}],\"chara-cv2-name\":\"安野希世乃/玄田哲章\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Seed_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/157829/a2626c5334d3162bf744e9cbc314a0b1_3524062249574072597.mp3\",\"status\":\"success\"}],\"chara-cv2-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Seed_02.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/157829/a20cecd873b9e2afdc4619540d8fc1f9_6245963631694704320.mp3\",\"status\":\"success\"}],\"chara-cover-home\":[{\"name\":\"席德-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/157829/d516676e8f25ce417d31039bab96b094_7390865208671714447.png\"}],\"chara-cover-inner\":[{\"name\":\"席德-内页PC端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/157829/9ea64355aa1c70e832f637b494f8b247_6101212025922221394.png\"}],\"chara-cover-m\":[{\ 女仆对此很有一手。』，这是爱丽丝鼓起勇气对我说的第一句话。」<\/p><p style=\"white-space: pre-wrap;\">——陷入回忆的露西<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「连那些艰涩的以太科学都能学会的小姐，怎么就是看不懂价签呢…」<\/p><p style=\"white-space: pre-wrap;\">——泰姆菲尔德家的女仆总叹气<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「不管多么不起眼的矿石，只要沾上『辉瓷』二字，就是另一副身价了。所谓的名门，本质上不也是如此吗？」<\/p><p style=\"white-space: pre-wrap;\">——达米安·布莱克伍德<\/p>","sExt":"{\"chara-nav\":[{\"name\":\"爱丽丝-首页导航.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156728/c6cc916bf74a0900072a2debe48b0fec_9085182491766861233.png\"}],\"chara-avatar\":[{\"name\":\"爱丽丝-角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156728/e79decbb89496962d5e43d12c8acfb9c_3624411308298773994.png\"}],\"chara-name\":\"爱丽丝·泰姆菲尔德\",\"chara-name-en\":\"Alice Thymefield\",\"chara-color\":\"#ffb0a3\",\"chara-line\":\"「这…这种程度的挑战，泰姆菲尔德家族的后人才不会退缩！」\",\"chara-cv1-name\":\"多多\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Alice_01.mp3\",\"status\":\"success\",\"uid\":1749110525955,\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156728/95f04c56fdd953ed270930ede1a1fb5f_3831583373284930355.mp3\"}],\"chara-cv1-audio2\":[],\"chara-cv2-name\":\"田中美海\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Alice_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156728/c3fe545a191b9dc2f5ba2f9821ef4fcb_3552253972675079195.mp3\",\"status\":\"success\"}],\"chara-cv2-audio2\":[],\"chara-cover-home\":[{\"name\":\"爱丽丝-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156728/89dc2b52ab90b5e3553ba108ffef6ce2_4689086059267506444.png\"}],\"chara-cover-inner\":[{\"name\":\"爱丽丝-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156728/ca70606adeb973bf64a2ad4e49ea7c54_7005478944521014974.png\"}],\"chara-cover-m\":[{\"name\":\"爱丽丝-首页移动端.png\",\"ur 钱吃蔬菜了。」<\/p><p style=\"white-space: pre-wrap;\">——狛野真斗<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「一年后，要不是我亲眼看到她指使那只狸猫，我恐怕真会一辈子都以为是触怒了狸猫大仙，才被降下了诅咒呢！」<\/p><p style=\"white-space: pre-wrap;\">——某位改邪归正的小贩<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「宝荣叔有一群很懂事的孩子呢，尤其是那个柚叶，能说会道的，店里生意也没少帮忙。宝荣叔也是好人有好报啊…」<\/p><p style=\"white-space: pre-wrap;\">——澄辉坪居民委员会副主任<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「绝不能被他们发现…必须…离这里越远越好…」<\/p><p style=\"white-space: pre-wrap;\">——在「遗忘」中愈加清晰的过去<\/p>","sExt":"{\"chara-nav\":[{\"name\":\"浮波柚叶-首页导航.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156729/360c300b50d822ed3001faa3263df758_2238551114914790656.png\"}],\"chara-avatar\":[{\"name\":\"浮波柚叶-角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156729/43ae40a750b7e6a0affc58e191757916_1980741451904466813.png\"}],\"chara-name\":\"浮波柚叶\",\"chara-name-en\":\"Ukinami Yuzuha\",\"chara-color\":\"#ed545a\",\"chara-line\":\"「觉得自己霉运缠身吗，那不妨问问…狸猫的建议吧？」\",\"chara-cv1-name\":\"金娜\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Yuzuha_01.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156729/b708e0cbef07216368ccd08e8911e662_5785193741386440854.mp3\"}],\"chara-cv1-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Yuzuha_02.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156729/39aa6c454d855ca7efda975aa8b805a1_4137788320430463821.mp3\"}],\"chara-cv2-name\":\"长谷川育美\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Yuzuha_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/156729/146a11d05eec1fdbc350a4e1000b5c5f_6072226681691048302.mp3\",\"status\":\"success\"}],\"chara-cv2-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Yuzuha_02.mp3\",\"url\":\"/archive/file p style=\"white-space: pre-wrap;\">——又一起藏品失窃案新闻下方的高赞评论<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「认识假币，防范假币。爱护丁尼，人人有责。」<\/p><p style=\"white-space: pre-wrap;\">——新艾利都治安局提醒您<\/p>","sExt":"{\"chara-nav\":[{\"name\":\"雨果-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154609/8853bd0f0863e04a49661317269f0e90_7955140626338278988.png\"}],\"chara-avatar\":[{\"name\":\"雨果-角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154609/f187608aaeac692b4c6202aea992df20_3648921785296803268.png\"}],\"chara-name\":\"雨果\",\"chara-name-en\":\"Hugo\",\"chara-color\":\"#6770e7\",\"chara-line\":\"「亲爱的朋友，我必如雪崩再来。」\",\"chara-cv1-name\":\"梁达伟\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"CN-GalGame_Chapter060_Hugo_010_001.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154609/3780a5316ed60fcdcec364e24986213c_1746330182706974095.mp3\"}],\"chara-cv1-audio2\":[],\"chara-cv2-name\":\"福山潤\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"JP-GalGame_Chapter060_Hugo_010_001.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154609/5bfd3ecfc315314e0ff7fa3df90ab0f6_6743702253880948894.mp3\"}],\"chara-cv2-audio2\":[],\"chara-cover-home\":[{\"name\":\"雨果-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154609/931ae0d821ace45a375a4332bf3e038e_8061430778645257430.png\"}],\"chara-cover-inner\":[{\"name\":\"雨果-内页PC端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154609/bdd06e63eaee0013c8d16287a5a93e48_6627937771561703806.png\"}],\"chara-cover-m\":[{\"name\":\"雨果-首页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154609/f9ca8419ebf937a3d850d9ac70b518fd_7174640418742846356.png\"}],\"chara-cover-inner-m\":[{\"name\":\"雨果-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154609/38f09926bd599c06e1c14684aa3e2 忠粉最近没有在绳网上发疯狂示爱贴，我都有点不习惯了…」<\/p><p style=\"white-space: pre-wrap;\">——一位不知名的绳网用户<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">嗯呢！嗯呢嗯呢！（不管捡到什么东西她都会送来治安局呢！哪怕是飞丢的气球，她也会送来！）<\/p><p style=\"white-space: pre-wrap;\">——光映广场治安布<\/p>","sExt":"{\"chara-nav\":[{\"name\":\"薇薇安-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154605/3fad331f39f9e51d09afaaf6c9a439e6_5032075989846293792.png\"}],\"chara-avatar\":[{\"name\":\"薇薇安-角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154605/6aa9864333ed958f50eccfa0bd2f1e3a_5371935286784919823.png\"}],\"chara-name\":\"薇薇安\",\"chara-name-en\":\"Vivian\",\"chara-color\":\"#cabcf2\",\"chara-line\":\"「不要关上窗，飞鸟会衔来爱意，衔走死亡。」\",\"chara-cv1-name\":\"陈阳\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"CN-GalGame_Chapter060_Vivian_130_015.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154605/99ce1d17ae0aa4e6bb64e3dbff764313_8897972868266775535.mp3\"}],\"chara-cv1-audio2\":[],\"chara-cv2-name\":\"水野朔\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"JP-GalGame_Chapter060_Vivian_130_015.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154605/93f8540c1931c81211cc5c4bb9d4d078_1537186668725657361.mp3\"}],\"chara-cv2-audio2\":[],\"chara-cover-home\":[{\"name\":\"薇薇安-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154605/f6b7a0a29487f8153da57fe124f048a9_4437497753091967697.png\"}],\"chara-cover-inner\":[{\"name\":\"薇薇安-内页PC端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154605/263bb17c4cc28104402b5ef7c6e3c7a1_6134066035615345167.png\"}],\"chara-cover-m\":[{\"name\":\"薇薇安-首页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/154605/f5e5f3c9dbd74d149d06f2ca40db70df_4488428014493486307.png\"}],\"chara-cover-inner-m\":[{\"name\":\"薇薇安-内页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyo ite-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「正因深知苦海尽头并无彼岸，所以我等撑桨渡河之举，才是存在的证明。」<\/p><p style=\"white-space: pre-wrap;\">——某个曾被标注阵亡之人的合成音<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「20个红豆包在8秒前瞬间售罄，而街头已经难以寻到红豆包的香气，看来…遇到对手了。」<\/p><p style=\"white-space: pre-wrap;\">——月城柳<\/p>","sExt":"{\"chara-nav\":[{\"name\":\"扳机-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129638/8e94d5712d2c172a1b20f9756076553a_6613076306117334580.png\"}],\"chara-avatar\":[{\"name\":\"扳机-角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129638/c404967b14044b58e05bed2679213dbd_8283889538082286267.png\"}],\"chara-name\":\"「扳机」\",\"chara-name-home\":\"「扳机」\",\"chara-name-en\":\"Trigger\",\"chara-color\":\"#ead75a\",\"chara-line\":\"「我，看到你了。」\",\"chara-cv1-name\":\"秦紫翼\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Trigger_01.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129638/03aafec71fbe09eff65aa4e2db31041b_5771082318181188958.mp3\"}],\"chara-cv1-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Trigger_01.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129638/03aafec71fbe09eff65aa4e2db31041b_4709681414522025583.mp3\"}],\"chara-cv2-name\":\"南條愛乃\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"JP_Vo_Gacha_Getchar_Trigger_01.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129638/6f410b0d15cfab51b2e3a2c51bc5589e_1341156630347510295.mp3\"}],\"chara-cv2-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Trigger_03.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129638/7c74768f0cb75600385b4a7d83b6f33d_8878247394830686919.mp3\"}],\"chara-cover-home\":[{\"name\":\"扳机-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129638/ab70d69803b35b1bd5cccaa Name":[],"sCategoryName":"","sSign":""},{"sChanId":["889"],"sTitle":"波可娜·费雷尼","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">「即便我们结下过梁子，但现在都过去了，身为霸主嘛，就是要…化肉干为金箔！」<\/p><p style=\"white-space: pre-wrap;\">——凯撒·金<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「加入我们也就罢了，你这个浑身是毛的家伙要是敢用本小姐的洗发水…噢~差点忘了，你们猫希人连澡都不喜欢洗。」<\/p><p style=\"white-space: pre-wrap;\">——露西亚娜·奥克希斯·提奥多·德·蒙特夫<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「警惕波可娜！她忘恩负义、阴险狡诈而且忘恩负义！除非迫不得已，不然我可不想跟她沾上关系。」<\/p><p style=\"white-space: pre-wrap;\">——巴罗姆<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「轻度灼伤。专家建议：尾大，无需多炎。」<\/p><p style=\"white-space: pre-wrap;\">——一张外环破旧诊所内被揉烂的诊单<\/p>","sExt":"{\"chara-nav\":[{\"name\":\"波可娜-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129637/820e6dcd91c095d82f1d91341268ab60_8854599843649530784.png\"}],\"chara-avatar\":[{\"name\":\"波可娜-角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129637/22caaaf3999fd9b413c2ce7d1667cdd9_8037228699291393591.png\"}],\"chara-name\":\"波可娜·费雷尼\",\"chara-name-en\":\"Pulchra Fellini\",\"chara-color\":\"#e5c28b\",\"chara-line\":\"「我只对赢家忠诚，而赢家，永远是我。」\",\"chara-cv1-name\":\"潘丹妮\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Pulchra_01.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129637/685960ce7d1e530f6f6bd6a9a6f3a438_7535092726903199363.mp3\"}],\"chara-cv1-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Pulchra_02.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129637/dac2b9944a888b76a5ba76edd321261d_8603343885724294042.mp3\"}],\"chara-cv2-name\":\"藤原夏海\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Pulchra_01.mp3\",\"status\":\"success\",\"url\":\"/archive/files/fastcd yle=\"white-space: pre-wrap;\">——一段语焉不详的神秘留言<\/p>","sExt":"{\"chara-nav\":[{\"name\":\"首页导航.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127403/2dbb8e56525f6b74a046e9e90964c955_8803952682843502461.png\"}],\"chara-avatar\":[{\"name\":\"角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127403/d91382cdacb9815b89fb4ff72233e81f_869264891784825520.png\"}],\"chara-name\":\"伊芙琳·舒瓦利耶\",\"chara-name-en\":\"Evelyn Chevalier\",\"chara-color\":\"#8e6dca\",\"chara-line\":\"「现在是小姐的私人时间，不接受任何形式的采访。」\",\"chara-cv1-name\":\"李婵妃\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Evelyn_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127403/9b8d555546d77aaf2c7e5506a69ef7d2_8155147506376898903.mp3\",\"status\":\"success\"}],\"chara-cv1-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Evelyn_02.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127403/67e324524f3e24aff13956da2a81b3d1_5692910266421878899.mp3\",\"status\":\"success\"}],\"chara-cv2-name\":\"日笠陽子\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"JP-Vo_Gacha_Getchar_Evelyn_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127403/21709e75212a07c23efb67152b6e0a7f_742057509007813557.mp3\",\"status\":\"success\"}],\"chara-cv2-audio2\":[{\"name\":\"JP-Vo_Gacha_Getchar_Evelyn_02.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127403/630368d58d94c8d45c6507ffa12cf4d1_6047872707136976901.mp3\",\"status\":\"success\"}],\"chara-cover-home\":[{\"name\":\"首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127403/3378105dfec7ed696aa1979d40fb7144_2381850327065183137.png\"}],\"chara-cover-inner\":[{\"name\":\"SP安比-内页PC端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/129632/49b9920c544925f63a7e90ca537884c9_5575033453043967134.png\"}],\"chara-cover-m\":[{\"name\":\"首页移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127403/b1 ht: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「女王大人，是丽都最闪亮的星辰！是拥有满分感染力歌声的音乐帝王！」<\/p><p style=\"white-space: pre-wrap;\">——一位谈及偶像激动不已的智能机器人<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\">「根据主人的指示，使用Fairy购票将会被界定为用超能力做坏事，因为人类无法在82毫秒内按下购票键。」<\/p><p style=\"white-space: pre-wrap;\">——回忆起抢购耀嘉音演唱会门票经历的Fairy<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\"> 「还不明白吗？在资本只手遮天的丽都，他们随便划开一根火柴，都能宣称这是唯一的太阳！」<\/p><p style=\"white-space: pre-wrap;\">——绳网论坛中一篇有千条留言的争议贴文<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"chara-nav\":[{\"name\":\"耀嘉音-首页导航.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127387/eec883c4a9d605e0560a33c94b5ad57a_2733958967591112455.png\"}],\"chara-avatar\":[{\"name\":\"耀嘉音-角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127387/2c6ff3109152efaead1c83ad7044f288_1404588502722576778.png\"}],\"chara-name\":\"耀嘉音\",\"chara-name-en\":\"Astra Yao\",\"chara-color\":\"#c4232f\",\"chara-line\":\"接下来的歌，献给这个世界！\",\"chara-cv1-name\":\"小N\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"GalGame_Chapter050_Astra_801_009.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127387/f6183b083a25b68ffcd59766b0a261c4_3142790485080313219.mp3\"}],\"chara-cv1-audio2\":[],\"chara-cv2-name\":\"远藤绫\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio1\":[{\"name\":\"耀嘉音JA.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127387/f50e5dfcb5043dfc1943c0cbd51de3d1_3969914876826617313.mp3\"}],\"chara-cv2-audio2\":[],\"chara-cover-home\":[{\"name\":\"耀嘉音-首页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127387/d03a4e46d5e3ae386907b1ef95f5a333_8651111707701327465.png\"}],\"chara-cover-inner\":[{\"name\":\"耀嘉音-内页PC.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/127387/a1e996f4707cca97327cad968e788779_2899812697511292085.png\"}],\"ch  12:00:00","dtEndTime":"2030-11-01 00:00:00","dtCreateTime":"2023-11-16 10:27:56","iInfoId":113671,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["310"],"sTitle":"亚历山德丽娜·莎芭丝缇安","sIntro":"","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\"><strong>「仲夏夜之梦舞曲」<\/strong><\/p><p style=\"white-space: pre-wrap;\">精致柔和的曼妙旋律，在丽娜身上自然而然地流淌。<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\"><strong>「命运交织协奏曲」<\/strong><\/p><p style=\"white-space: pre-wrap;\">玩偶们演绎的附加乐章，最好竖起所有耳朵听。<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\"><strong>「新新世界交响曲」<\/strong><\/p><p style=\"white-space: pre-wrap;\">激昂有力却不失优雅，揍人也是一如既往地美丽。<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\"><strong>「沉默悲怆奏鸣曲」<\/strong><\/p><p style=\"white-space: pre-wrap;\">看到丽娜走进厨房时，很多人脑中会响起的配乐。<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p>","sExt":"{\"chara-nav\":[{\"name\":\"丽娜-首页PC头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/113612/eaeeb664e42cce8a58d1ae0820d1a64b_3831604358414660366.png\"}],\"chara-avatar\":[{\"name\":\"丽娜-角色内页头像.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/113612/1017d77a8f98ad151de5d152d4f5372d_7514167879033239625.png\"}],\"chara-name\":\"亚历山德丽娜\",\"chara-name-en\":\"RINA\",\"chara-color\":\"#cfc9ba\",\"chara-line\":\"您就是这次的主人吗？<br/>维多利亚家政丽娜，为您服务。\",\"chara-cv1-name\":\"张若瑜\",\"chara-cv1-lang\":\"中\",\"chara-cv1-audio1\":[{\"name\":\"Vo_Gacha_Getchar_Rina_01.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/113612/5147ade1c4132f5c2eb42a71cbda9e6b_2176645014508546051.mp3\"}],\"chara-cv1-audio2\":[{\"name\":\"Vo_Gacha_Getchar_Rina_03.mp3\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/113612/e51f855d42ca392117058669dfa0581c_3816991784649142697.mp3\"}],\"chara-cv2-name\":\"新井里美\",\"chara-cv2-lang\":\"日\",\"chara-cv2-audio pace: pre-wrap; text-align: center; line-height: 2;\">关于家主大人执意留下的这帧「纪念影像」，首席助手在归档栏里写道：<\/p><p style=\"white-space: pre-wrap; text-align: center; line-height: 2;\">「恕我直言，此种构图在美学上的价值有待商榷…」<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em; text-align: center; line-height: 2;\"><\/p><p style=\"white-space: pre-wrap; text-align: center; line-height: 2;\">停顿片刻，她又默默补上：<\/p><p style=\"white-space: pre-wrap; text-align: center; line-height: 2;\">「但小姐笑得很开心，故予以保留。」 <\/p><p style=\"white-space: pre-wrap; min-height: 1.5em; text-align: center; line-height: 2;\"><\/p><p style=\"white-space: pre-wrap; min-height: 1.5em; text-align: center; line-height: 2;\"><img src=\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166450/76c16df24079b4c53fe7bfa95e237778_2120873995875681202.jpg\" href=\"\" data-origin-width=\"\" style=\"vertical-align:middle;\"><\/p><p style=\"white-space: pre-wrap; min-height: 1.5em; text-align: center; line-height: 2;\"><\/p><p style=\"white-space: pre-wrap; min-height: 1.5em; text-align: center; line-height: 2;\"><img src=\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166450/5c8ce68aed2385e2a2ec0129fad2b74a_1337319693014988354.jpg\" href=\"\" data-origin-width=\"\" style=\"vertical-align:middle;\"><\/p>","sExt":"{\"news-banner\":[{\"name\":\"CHS-1920×1080.jpg\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166450/b81c09c8eb50b9b60865e10ad0c5244e_3806073254808076687.jpg\"}]}","dtStartTime":"2026-09-25 18:15:00","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2026-09-23 11:16:39","iInfoId":166450,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["295"],"sTitle":"盈月辉光丨弗林特工坊","sIntro":"「小姐。辉金活性在满月之日达到峰值。持续约六小时，已经记录下来了。」","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap; text-align: center; line-height: 2;\">「小姐。辉金活性在满月之日达到峰值。持续约六小时，已经记录下来了。」<\/p><p style=\"white-space: pre-wrap; text-align: center; line-height: 2;\">「…嗯。我也感受到了，身体似乎有些不同寻常的变化。像是一种…古老的冲动。或许是弗林特血脉在满月之下产生了某种原始的共鸣。」<\/p><p style=\"white-space: pre-wrap; text-align: center; line-height: 2;\">「明白了小姐，片刻闲满月限定甜品已帮您准备好了，是现在吃吗？」<\/p><p style=\"white-space: pre-wrap; text-align: center; line-height: 2;\">「本小姐还在工作呢！！什么时候说我要吃了…总之先、先放桌上吧！」 <\/p><p style=\"white-space: pre-wrap; min-height: 1.5em; text-align: center; line-height: 2;\"><\/p><p style=\"white-space: pre-wrap; min-height: 1.5em; text-align: center; line-height: 2;\"><img src=\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166449/f97f32078e4deab625421895c2d406a2_7808123482210775235.jpg\" href=\"\" data-origin-width=\"\" style=\"vertical-align:middle;\"><\/p>","sExt":"{\"news-banner\":[{\"name\":\"EN-2000x1400.jpg\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/166449/f97f32078e4deab625421895c2d406a2_4127820911485543707.jpg\"}]}","dtStartTime":"2026-09-25 12:15:00","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2026-09-23 11:16:14","iInfoId":166449,"sTagName":[],"sCategoryName":"","sSign":""}],"289":[{"sChanId":["289"],"sTitle":"双重身份，别样生活","sIntro":"","sUrl":"","sAuthor":"","sContent":"","sExt":"{\"feature-banner\":[{\"name\":\"1.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102108/7bc55ff86cdd49d516156efd1568fa07_8411108402506807591.png\"}],\"feature-banner-m\":[{\"name\":\"1.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102108/b6df4303b484176f52d0dec2567c5763_3819475092935429212.png\"}],\"feature-inner\":[{\"name\":\"街景的平静时光.png\",\"url\":\"/archive/files/webstatic.hoyoverse.com/upload/op-public/2022/05/12/cab90b0599e8a44af53680b83d323faf_7898212636674981689.png\"}]}","dtStartTime":"2022-04-29 01:54:29","dtEndTime":"2035-01-01 00:00:00","dtCreateTime":"2022-05-09 22:29:52","iInfoId":102108,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["289"],"sTitle":"小队组合，高速激斗","sIntro":"","sUrl":"","sAuthor":"","sContent":"","sExt":"{\"feature-banner\":[{\"name\":\"2.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102110/335b902943421506f5e1b1618df4f216_1738518333523728 35-01-01 00:00:00","dtCreateTime":"2022-05-09 22:46:43","iInfoId":102112,"sTagName":[],"sCategoryName":"","sSign":""}],"290":[{"sChanId":["290"],"sTitle":"邦布","sIntro":"小小的身体，大大的用处","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\"><strong>小小的身体，大大的用处<\/strong><\/p><p style=\"white-space: pre-wrap;\">当你走在街头，看到一个发出“嗯嗯呢呢”声音的小小身影，请不要被吓到。这是新艾利都特有的风光之一，小型智能设备——邦布。邦布只有成人膝盖那么高，但他们却是新艾利都城市运转不可或缺的得力助手。经过多年的生产研发，如今邦布的综合应用场景非常广泛，很多工厂也会提供定制服务，以便不同人群使用特定功能的邦布。<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\"><strong>邦布可以用来做什么？<\/strong><\/p><p style=\"white-space: pre-wrap;\">邦布最初诞生的目的是帮助新艾利都居民进行空洞灾害的避难行动，当新艾利都生活区域内出现空洞灾害时，每一台邦布都会第一时间从公用网络上接受到灾情信息与避难指引，他们会帮助自己身边的人群规避灾害。<\/p><p style=\"white-space: pre-wrap;\">现如今，因更成熟的技术和多样的需求，邦布已经从单纯的避灾用小型辅助智能机械变为了更为综合泛用的智能个体，甚至有专业版的邦布会与调查员一起深入空洞中进行各项作业。<\/p><p style=\"white-space: pre-wrap; min-height: 1.5em;\"><\/p><p style=\"white-space: pre-wrap;\"><strong>==邦布的自我使用介绍==<\/strong><\/p><p style=\"white-space: pre-wrap;\">1.嗯呢呢嗯，嗯嗯呢！<\/p><p style=\"white-space: pre-wrap;\">（使用前请认真阅读附带的使用说明书。）<\/p><p style=\"white-space: pre-wrap;\">2.&nbsp;嗯嗯呢嗯呢呢嗯，呢呢嗯嗯嗯！呢嗯！<\/p><p style=\"white-space: pre-wrap;\">（请在正规渠道购买我们，切勿私自购买非法改装的邦布！我们无法保证此类邦布的安全性！）<\/p><p style=\"white-space: pre-wrap;\">3.呢嗯呢呢嗯、嗯呢呢嗯嗯、呢嗯嗯嗯、嗯嗯呢嗯呢！<\/p><p style=\"white-space: pre-wrap;\">（如果我们突然开始发出难听的噪音、行动迟缓、表情闪烁，请立即找到充电桩并为邦布充电。）<\/p><p style=\"white-space: pre-wrap;\">4.嗯嗯呢嗯，呃嗯呃呢嗯，呢呢嗯嗯嗯，呃嗯呢嗯呢呢！<\/p><p style=\"white-space: pre-wrap;\">（当你在街头遇到独行的我们，请不要试图拐回家，偷窃邦布是违法的！）<\/p><p style=\"white-space: pre-wrap;\">5.嗯嗯呢嗯！❥(^_-)<\/p><p style=\"white-space: pre-wrap;\">（精准翻译失败，可能表达：可爱、掰掰、就是这样、说完了）<\/p>","sExt":"{\"world-banner\":[{\"name\":\"官网目录页-PC（邦布介绍）.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102370/39e68a14404891ba2e8f27c57e95ad46_281487455177947286.png\"}],\"world-banner-m\":[{\"name\":\"内页档案-插图（移动端）.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102370/d939babbf873b4881cdeac7f71901d83_4506111104540170839.png\"}],\"world-home-banner\":[{\"name\":\"官网首页Banner-PC（邦布介绍）.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102370/0a3fab8aa62d35d4cb0013bcb90253d6_4785974286708189785.png\"}],\"world-name\":\"邦布\",\"world-name-en\":\"\\u003cspan style=\\\"font-size:0.78rem\\\"\\u003eBangboo\\u003c/span\\u003e\",\"world-slide\":[{\"name\":\"官网-设定档案-邦布介绍-录像带封面(无字）.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102370/4335f1f09a46775ba2410124c53b47c8_4602178121928237092.png\"}]}","dtStartTime":"2022-07-02 12:00:00","dtEndTime":"2030-06-01 00:00:00","dtCreateTime":"2022-06-29 10:19:29","iInfoId":102370,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["290"],"sTitle":"城市生活","sIntro":"新艾利都里有空洞，数量还不少。","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\"><strong>与空洞毗邻而居的新生活！<\/strong><br>新艾利都里有空洞，数量还不少。<br>等下，先不要尖叫，也别恐慌！与空洞毗邻而居正是这座奇迹之城的特色！<br>新艾利都的创始人们掌握了应对空洞的技术，甚至还拥有从空洞中开采以太资源的能力。<br>整个都市的繁荣高度依赖于这一珍贵的资源，这是独属于新艾利都的魔法！<\/p><p style=\"white-space: pre-wrap;\"><br><strong>缤纷多彩的大都会<\/strong><br>热忱、开放、自由是新艾利都的底色，不论是灾害难民、流浪者或是其他聚居点的幸存者，都能在新艾利都找到一席之地！<br>正是多样的人造就了多彩的都市样貌，这里既能看到以太技术铸就的奇观，也保留着旧文明遗存的角落。<br>只要别去招惹那些帮派、盗洞客、怪咖或阴谋家，避开空洞灾害，听从指挥调遣，新艾利都会给你完美的生活体验！<\/p><p style=\"white-space: pre-wrap;\"><br><strong>奇迹之城慢生活<\/strong><br>你好奇以太技术的发展嘛？你怀念旧文明的时光嘛？你想要重回都市生活的热闹？或者只想守护灾难时代里的小日子？<br>没~有~问~题，新艾利都满足你的渴望！就比如这条六分街，复古音像店、录像店、实体潮玩店、拉面料理店、电玩店……即使是灾害环伺的世界里，你依然可以在这里用力地生活！<br><br><strong>==新居民入住贴士==<\/strong><br>想要在新艾利都立足，你需要做好以下准备：<br>1. 给自己一点适应新生活的时间。<br>2. 随时可以灵活应对意外情况的身体条件。<br>3. 与空洞相伴而生的强大心理素质。<br>4. 四处逛逛走走，认识这座最后和最初之城。<\/p>","sExt":"{\"world-banner\":[{\"name\":\"档案内页图.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102257/5b9694391a83cba8a7bcbb8632c80dda_9041691497940896313.png\"}],\"world-banner-m\":[{\"name\":\"移动端.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102257/9cde98a41fbe59b5bc56cefb80fe3f89_3670565193490275025.png\"}],\"world-home-banner\":[{\"name\":\"首页Banner.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102257/7dc8e490e0e15e0656458003241b94ad_614488157834342400.png\"}],\"world-name\":\"城市生活\",\"world-name-en\":\"The city life\",\"world-slide\":[{\"name\":\"封面.png\",\"url\":\"/archive/files/fastcdn.hoyoverse.com/content-v2/nap/102257/f85e04ea3182276e650cb81a1bc2d26d_2271782842542584719.png\"}]}","dtStartTime":"2022-06-05 12:00:00","dtEndTime":"2035-05-01 00:00:00","dtCreateTime":"2022-05-30 17:50:57","iInfoId":102257,"sTagName":[],"sCategoryName":"","sSign":""},{"sChanId":["290"],"sTitle":"新艾利都入住指南 | 空洞生存篇","sIntro":"空洞是毁灭世界的灾难，是一种凭空出现、吞噬一切的异常球体空间","sUrl":"","sAuthor":"","sContent":"<p style=\"white-space: pre-wrap;\">让我们重新认识空洞<br>空洞是毁灭世界的灾难，是一种凭空出现、吞噬一切的异常球体空间，其内部时空环境因未知效应的影响变得紊乱无序，还会产生被称为“以骸”的危险异形生物。普通人迷失在空洞里不仅要面对恐怖异形的袭击，自身也会有发生侵蚀变异的危险。<br>但是！请广大市民们不用担心，新艾利都已经完全掌握了管控空洞灾害的技术！甚至还拥有从空洞中采掘贵重的以太资源的能力！新艾利都就是空洞灾害时代的奇迹，是大家唯一的选择！<\/p><p style=\"white-space: pre-wrap;\"><br>空洞危险吗？<br>好问题。这取决于提问的人是谁。<br>你是空洞调查协会的成员？哈哈，“办公室”怎么会有危险呢！<br>你是盗洞客？空洞（×），聚宝盆（√）！<br>你是以骸？哇哦……欢迎回家！<br>你是普通平民？请参考下文信息。<\/p><p style=\"white-space: pre-wrap;\"><br>空洞里有什么？<br>一、攻击一切外来活物的异形怪物。<br>二、像空气一样无处不在的未知物质，具有超高资源潜力但也伴随着神秘侵蚀性。<br>三、被上一条物质附着侵蚀，正在慢慢变异且逐渐丧失意志的倒霉蛋。<br>四、无法无天的歹徒。是的，空洞里也有暴徒强盗。真是无可救药。<br>五、无惧空洞危险的狂人们。比如盗洞客、绳匠或者单纯的疯子。真是无药可救。<br>六、官方机构的工作人员，唯一指定救星。<\/p><p style=\"white-space: pre-wrap;\"><br>==空洞自救贴士==<br>1.不要乱跑。请记住，空洞内的空间是无序且紊乱的。<br>2.找一个安全的角落，等待救援人员到场。<br>3.如果被以骸、侵蚀体或其它危险因素发现，不得不逃跑时，请往呼吸起来感觉更轻松、清新的方向逃跑。<br>4.请相信空洞调查协会官方认可的调查员，不要与“绳匠”或“盗洞客”为伍。<\/p>","sExt":"{\"world-banner\":[{\"name\":\"档案空洞-内页.png\",\"url\":\"/archive/files/webstatic.hoyoverse.com/upload/op-public/2022/05/18/5b8e5572917028de17b25e205e0ed682_6152042526272336891.png\"}],\"world-banner-m\":[{\"name\":\"空洞.png\",\"url\":\"/archive/files/webstatic.hoyoverse.com/upload/op-public/2022/06/01/820c4e9fc8f6539081000731303e7b28_2837287635900741255.png\"}],\"world-home-banner\":[{\"name\":\"CHS.png\",\"url\":\"/archive/files/webstatic.hoyoverse.com/uploa
